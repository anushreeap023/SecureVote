<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="nav.results_mgmt">Results Publication Control — SecureVote Prototype</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="educational-banner">
    <span class="badge" data-i18n="home.banner_badge">EDUCATIONAL DEMO</span>
    <span data-i18n="brand.disclaimer">Educational election simulation prototype using fictional data. Strictly not for real government elections.</span>
  </div>

  <header class="app-header"></header>

  <div class="dashboard-layout">
    <aside class="dashboard-sidebar" id="admin-sidebar"></aside>

    <main class="dashboard-main">
      <div style="margin-bottom: 2rem;">
        <h1 data-i18n="nav.results_mgmt">Controlled Results Publication</h1>
        <p style="color: var(--color-navy-muted);">
          Review final ballot reconciliation, conduct cryptographic consistency checks, and certify simulation outcomes for public release.
        </p>
      </div>

      <!-- Election Picker Card -->
      <div class="card" style="margin-bottom: 2rem; padding: 1.5rem;">
        <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
          <label for="pub-election-picker" style="font-weight: 700; color: var(--color-navy-text);">
            Select Closed Election for Certification:
          </label>
          <select id="pub-election-picker" class="form-control" style="max-width: 500px;">
            <option value="">Loading elections...</option>
          </select>
        </div>
      </div>

      <!-- Main Review Area -->
      <div id="pub-review-container">
        <!-- Rendered by results-management.js -->
        <div class="card skeleton" style="height: 300px;"></div>
      </div>
    </main>
  </div>

  <footer class="app-footer"></footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/results-management.js"></script>
</body>
</html>
